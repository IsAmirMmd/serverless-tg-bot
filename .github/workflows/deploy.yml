# Deploys the bot and the admin Mini App to Telegram Serverless on every push
# to main that changes them, so the live bot always runs what is on main.
# Needs the repository secret TGCLOUD_TOKEN (BotFather → your bot → Serverless →
# CLI Access → Access token); without it the job does nothing.
name: Deploy bot

on:
  push:
    branches: [main]
    paths:
      - 'tgcloud/**'
      - 'src/**'
      - 'index.html'
      - 'vite.config.js'
      - 'tgcloud.jsonc'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch: {}

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.TGCLOUD_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.TGCLOUD_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.TGCLOUD_TOKEN != ''
      # push uploads dist/ as it is on disk, so build the Mini App first.
      - run: npm run build
        if: env.TGCLOUD_TOKEN != ''
      # fetch: learn the cloud's current revision, so push sends only the changes
      # (a fresh checkout has no .tgcloud/ snapshot). main is the source of truth:
      # modules that exist only in the cloud are deleted.
      - name: Deploy
        if: env.TGCLOUD_TOKEN != ''
        run: |
          mkdir -p .tgcloud
          npx tgcloud fetch
          npx tgcloud push
      # migrate --safe: apply added tables/columns/indexes; anything that drops
      # data is skipped and must be applied by hand with `npm run update`.
      # Its own step, run even when push failed: push can fail after the code is
      # already deployed (the CLI crashed writing its local snapshot), and the
      # schema must not stay behind the code. It diffs against the deployed schema.js.
      - name: Migrate
        if: always() && env.TGCLOUD_TOKEN != ''
        run: |
          mkdir -p .tgcloud
          npx tgcloud migrate --safe
      # The update types the bot receives come from tgcloud/handlers/ (e.g.
      # chat_member for join tracking). push refreshes them, but a push that
      # failed half way may not have. Sync is idempotent, keeps pending updates,
      # and prints what the webhook now receives.
      - name: Webhook
        if: always() && env.TGCLOUD_TOKEN != ''
        run: |
          mkdir -p .tgcloud
          npx tgcloud webhook sync
      # On failure: the modules the server returned as `false` instead of source
      # (what made the CLI's snapshot write crash). Names only, not contents.
      - name: Diagnose
        if: failure() && env.TGCLOUD_TOKEN != ''
        run: |
          TGCLOUD_DEBUG=1 npx tgcloud fetch 2>&1 | grep -oE '"[A-Za-z0-9_./-]+": ?(false|null|true|[0-9]+)[,}]' | sort -u || true
