<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<!-- Bot description picture (BotFather → /setdescriptionpic), 16:9.
     Rendered to banner.png at 1280×720; Telegram shows it at 640×360. -->
<style>
  @font-face { font-family: "Mirza Vazir"; src: url("../src/fonts/Vazirmatn-Variable.woff2") format("woff2"); font-weight: 100 900; }
  :root { --ink:#17181a; --cream:#f4efe7; --paper:#fffdf9; --coral:#fa604e; --coral-soft:#fbdcd4; --green:#2f6b3a; --green-soft:#dcebd9; --muted:#b8afa4; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1280px; height: 720px; overflow: hidden; font-family: "Mirza Vazir", sans-serif; color: var(--cream);
         background: radial-gradient(120% 120% at 25% 45%, #2b2c2f 0%, #141516 60%); position: relative; }
  .glow { position: absolute; left: 60px; top: 70px; width: 600px; height: 600px; border-radius: 50%;
          background: radial-gradient(circle, rgba(250,96,78,.28), rgba(250,96,78,0) 70%); }

  /* ---------- text (right) ---------- */
  /* Sized for a phone, where Telegram shows the picture ~340px wide (¼ scale). */
  .copy { position: absolute; right: 80px; top: 0; bottom: 0; width: 580px; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
  .chip { align-self: flex-start; padding: 6px 20px; border: 3px solid var(--cream); border-radius: 999px; font-size: 28px; font-weight: 800; }
  .title { font-size: 128px; font-weight: 900; line-height: 1; letter-spacing: -2px; direction: ltr; text-align: right;
           text-shadow: 7px 7px 0 var(--coral); }
  .sub { font-size: 48px; font-weight: 900; line-height: 1.4; }
  .sub em { font-style: normal; color: var(--coral); }
  .points { display: flex; gap: 14px; flex-wrap: wrap; }
  .points span { padding: 6px 16px; border-radius: 14px; background: rgba(244,239,231,.08); border: 1.5px solid rgba(244,239,231,.25);
                 font-size: 22px; font-weight: 700; }
  .cta { align-self: flex-start; margin-top: 8px; padding: 14px 38px; background: var(--coral); color: var(--ink);
         border: 4px solid var(--cream); border-radius: 20px; box-shadow: 0 8px 0 var(--cream); font-size: 40px; font-weight: 900; }

  /* ---------- visual (left) ---------- */
  .record { position: absolute; left: 96px; top: 98px; width: 480px; height: 480px; border-radius: 50%;
            background: repeating-radial-gradient(circle, #0d0e0f 0 22px, #2c2d2a 22px 25px);
            border: 14px solid var(--cream); box-shadow: 0 18px 0 var(--coral); }
  .record::after { content: ""; position: absolute; inset: 132px; border-radius: 50%; background: var(--coral); border: 10px solid var(--cream); }
  .sheen { position: absolute; left: 150px; top: 150px; width: 380px; height: 380px; border-radius: 50%;
           border: 10px solid transparent; border-top-color: rgba(244,239,231,.3); transform: rotate(-38deg); }
  .heart { position: absolute; left: 290px; top: 286px; width: 92px; z-index: 1; }

  .post { position: absolute; left: 300px; top: 388px; width: 380px; z-index: 2; background: var(--paper); color: var(--ink);
          border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 8px 0 var(--ink); padding: 16px; }
  .track { display: flex; align-items: center; gap: 14px; direction: ltr; }
  .play { flex: none; width: 54px; height: 54px; border-radius: 50%; background: var(--coral); border: 3px solid var(--ink); position: relative; }
  .play::after { content: ""; position: absolute; left: 19px; top: 13px; border-left: 18px solid var(--ink); border-top: 11px solid transparent; border-bottom: 11px solid transparent; }
  .track b { display: block; font-size: 22px; font-weight: 800; line-height: 1.3; }
  .track small { font-size: 16px; color: #5c5650; }
  .wave { display: flex; align-items: center; gap: 3px; height: 26px; margin: 12px 0 14px; direction: ltr; }
  .wave i { flex: 1; background: #20211f; border-radius: 3px; }
  .buttons { display: flex; gap: 10px; }
  .buttons span { flex: 1; text-align: center; padding: 8px 0; border: 2.5px solid var(--ink); border-radius: 14px; font-size: 22px; font-weight: 800;
                  box-shadow: 0 4px 0 var(--ink); }
  .like { background: var(--green-soft); }
  .dislike { background: var(--coral-soft); }
</style>
</head>
<body>
  <div class="glow"></div>

  <div class="record"></div>
  <div class="sheen"></div>
  <svg class="heart" viewBox="0 0 100 88"><path fill="#f4efe7" d="M50 88 C20 65 0 46 0 26 C0 10 12 0 27 0 C38 0 46 6 50 15 C54 6 62 0 73 0 C88 0 100 10 100 26 C100 46 80 65 50 88 Z"/></svg>

  <div class="post">
    <div class="track">
      <div class="play"></div>
      <div><b>Tanha · Matin Fattahi</b><small>03:41</small></div>
    </div>
    <div class="wave" id="wave"></div>
    <div class="buttons">
      <span class="like">❤️ ۱۲۸</span>
      <span class="dislike">🥀 ۹</span>
    </div>
  </div>

  <div class="copy">
    <span class="chip">🎧 ربات کانال موزیک</span>
    <h1 class="title">LikeTune</h1>
    <p class="sub">لایک، آمار و گزارش<br>برای <em>کانال‌های موزیک</em></p>
    <span class="cta">همین الان استارت کن 👇</span>
  </div>

  <script>
    // A fixed-looking waveform (deterministic, so every render is identical).
    const wave = document.getElementById('wave');
    for (let i = 0; i < 44; i++) {
      const h = 25 + Math.round(70 * Math.abs(Math.sin(i * 0.9) * Math.cos(i * 0.37)));
      const bar = document.createElement('i');
      bar.style.height = h + '%';
      if (i < 15) bar.style.background = '#fa604e';
      wave.appendChild(bar);
    }
  </script>
</body>
</html>
